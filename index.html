<!DOCTYPE html>
<html lang="tr">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./workintech.svg" />
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workintech + 🍕</title>
  </head>

  <body>
    <header class="hero">
      <div class="app">
        <div class="hero-content">
          <p>Fırsatları Kaçırma</p>
          <h1 class="anaBaslik">KOD ACIKTIRIR PİZZA, DOYURUR</h1>
          <button>Acıktım</button>
        </div>
        <div class="logo">
         <img src="./public/assets/iteration-1/logo.svg" alt="Teknolojik Yemekler">
        </div>
      </div>
    </header>
    <main class="main-content">
      <div class="categories">
        <ul class="categories__list">
          <li class="categories__item">
            <img src="./public/assets/iteration-2/icons/1.svg" alt="Kore">
            <span>YENİ! Kore</span>
          </li>
          <li class="categories__item">
            <img src="./public/assets/iteration-2/icons/2.svg" alt="Pizza">
            <span>Pizza</span>
          </li>
          <li class="categories__item">
            <img src="./public/assets/iteration-2/icons/3.svg" alt="Burger">
            <span>Burger</span>
          </li>
          <li class="categories__item">
            <img src="./public/assets/iteration-2/icons/4.svg" alt="Kızartmalar">
            <span>Kızartmalar</span>
          </li>
          <li class="categories__item">
            <img src="./public/assets/iteration-2/icons/5.svg" alt="Fast Food">
            <span>Fast Food</span>
          </li>
          <li class="categories__item">
            <img src="./public/assets/iteration-2/icons/6.svg" alt="Kore">
            <span>Gazlı İçecek</span>
          </li>
        </ul> 

      </div>
      <section class="campaigns">
        <div class="campaigns__item campaigns__item--left">
          <div class="campaigns__content">
            <h2>Özel Lezzetus</h2>
            <p>Position:Absolute Acı Burger</p>
            <button>SİPARİŞ VER</button>
          </div>
        </div>
        <div class="campaigns__right-col">
          <div class="campaigns__item campaigns__item--top">
            <div class="campaigns__content">
              <h3>Hackathlon Burger Menü</h3>
              <button>SİPARİŞ VER</button>
            </div>
          </div>
          <div class="campaigns__item campaigns__item--bottom">
            <div class="campaigns__content">
              <h3>Çooooook hızlı npm gibi kurye</h3>
              <button>SİPARİŞ VER</button>
            </div>
          </div>
        </div>
      </section>

    </main>

  </body>

</html>
